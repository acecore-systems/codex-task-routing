name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_package.py
      - name: Require a new version for distributed changes
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_release.py
  apply_issue10:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 11 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/terra-chat-fixed-effort'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact verified file edits and remove temporary transfer plumbing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          from pathlib import Path, PurePosixPath
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          parts = [Path(f'.github/issue10-payload.{i}') for i in (1, 2, 3)]
          encoded = b''.join(b''.join(p.read_bytes().split()) for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != 'f6d527683513811baf7bd69fef3f7e543e19b2addfddf5a33db5a6d0ef302593':
              raise SystemExit('Transferred payload hash mismatch')
          edits = json.loads(lzma.decompress(compressed))
          if not isinstance(edits, dict) or len(edits) != 25:
              raise SystemExit('Unexpected edit set')
          baseline = '59879ad02995c16e398de7bd7fd0e2f2d58ad9b7'
          workflow = '.github/workflows/checks.yml'
          Path(workflow).write_bytes(git('show', f'{baseline}:{workflow}'))
          git('add', '--', workflow)
          git('rm', '--', *(str(p) for p in parts))
          if git('write-tree').decode().strip() != 'f3ddd3ecab073273c1ff9593b8f05b1dd607ba10':
              raise SystemExit('Baseline changed; refusing to apply')
          for name, change in edits.items():
              relative = PurePosixPath(name)
              if relative.is_absolute() or '..' in relative.parts or relative.parts[0] not in {'AGENTS.md', 'README.md', 'docs', 'plugins', 'scripts', 'tests'}:
                  raise SystemExit('Invalid edit path')
              path = Path(name)
              if path.is_symlink() or any(p.is_symlink() for p in path.parents):
                  raise SystemExit('Refusing symlink edit')
              before = change['before']
              if before is None:
                  if path.exists():
                      raise SystemExit('New file already exists')
                  original = b''
              else:
                  original = path.read_bytes()
                  if hashlib.sha256(original).hexdigest() != before:
                      raise SystemExit('Original file hash mismatch')
              lines = original.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(change['edits']):
                  if not 0 <= start <= end <= len(lines):
                      raise SystemExit('Invalid edit range')
                  lines[start:end] = replacement
              updated = ''.join(lines).encode('utf-8')
              if hashlib.sha256(updated).hexdigest() != change['after']:
                  raise SystemExit('Result file hash mismatch')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(updated)
          git('add', '--', *edits.keys())
          if git('write-tree').decode().strip() != 'ddace7831eec6e09c0032a1b14c02816446558f6':
              raise SystemExit('Final tree differs from locally tested tree')
          PY
          python -m unittest discover -s tests -v
          python scripts/check_package.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Terra親・固定effortと6 Pro優先の工程ルーティングを実装'
          python scripts/check_release.py --base 59879ad02995c16e398de7bd7fd0e2f2d58ad9b7
          git push origin HEAD:codex/terra-chat-fixed-effort
