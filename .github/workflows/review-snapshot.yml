name: PR11 review snapshot
on:
  push:
    branches: [codex/pr11-review-snapshot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export only the reviewed source and its base
        run: |
          git archive --format=zip --output=pr11-head.zip 6f57344a35813698b30ae4010cf350a1901dcc0e
          git archive --format=zip --output=pr11-base.zip 59879ad02995c16e398de7bd7fd0e2f2d58ad9b7
      - uses: actions/upload-artifact@v4
        with:
          name: pr11-fixed-source
          path: |
            pr11-head.zip
            pr11-base.zip
          retention-days: 1
