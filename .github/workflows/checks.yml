name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_package.py
      - name: Require a new version for distributed changes
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_release.py
      - name: Export source snapshot for offline PR review
        if: matrix.os == 'ubuntu-latest'
        run: git archive --format=zip --output=review-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: review-source-${{ github.sha }}
          path: review-source.zip
          retention-days: 1
