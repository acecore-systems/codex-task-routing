name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11']
        include:
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test tests/test_chat_browser.cjs tests/test_chat_browser_run.cjs
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_package.py
      - name: Require a new version for distributed changes
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_release.py
