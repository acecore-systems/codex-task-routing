name: Checked Browser preflight transfer (temporary)
on:
  pull_request:
    paths: ['.github/workflows/source-review-transfer.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/browser-operation-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce only the reviewed source tree
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, tempfile
          from pathlib import Path, PurePosixPath
          expected = ['5a526a6a5de2220f7af7454762be2cc3a512d003', '2272feb66443a67db51e6b34258230417436bdd4', '49fd9b5eb474c9be285b4dd2219b8c27a7c49ad5', '4c33ab1c3e7285f113569c09d0db76727a6f62fd']
          helpers = ['.github/preflight-delta.' + str(i) + '.json' for i in range(4)]
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          changed = []
          for helper, expected_sha in zip(helpers, expected):
              raw = Path(helper).read_bytes()
              assert blob(raw) == expected_sha
              for item in json.loads(raw):
                  rel = PurePosixPath(item['path'])
                  assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
                  assert item['path'] in {'AGENTS.md', 'README.md'} or item['path'].startswith(('plugins/codex-task-routing/', 'tests/', 'docs/'))
                  p = Path(rel)
                  assert not any(part.is_symlink() for part in (p, *p.parents))
                  original = p.read_bytes()
                  assert blob(original) == item['before'], item['path']
                  text = original.decode('utf-8')
                  previous = 0
                  for start, end, replacement in item['edits']:
                      assert previous <= start <= end <= len(text)
                      previous = end
                  for start, end, replacement in reversed(item['edits']):
                      text = text[:start] + replacement + text[end:]
                  content = text.encode('utf-8')
                  assert blob(content) == item['after'], item['path']
                  p.write_bytes(content)
                  changed.append(item['path'])
          assert len(changed) == len(set(changed)) == 14
          subprocess.run(['git', 'add', '--', *changed], check=True)
          staged = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          helpers.append('.github/workflows/source-review-transfer.yml')
          with tempfile.TemporaryDirectory() as folder:
              env = {**os.environ, 'GIT_INDEX_FILE': str(Path(folder) / 'index')}
              subprocess.run(['git', 'read-tree', staged], env=env, check=True)
              subprocess.run(['git', 'update-index', '--force-remove', '--', *helpers], env=env, check=True)
              target = subprocess.check_output(['git', 'write-tree'], env=env, text=True).strip()
              assert target == 'b5ab74cfb2a00de5369fbfeeacd63e16acdd2d2b', target
          print('Validated final source tree:', target)
          PY
      - name: Test the reviewed source
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_package.py
          git diff --cached --check
      - name: Commit only to the requested branch
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Browserの確認・送信・回収を分離し重複証拠を不要化'
          git push origin HEAD:refs/heads/codex/browser-operation-preflight
