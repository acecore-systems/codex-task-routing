name: Routing source snapshot (temporary)
on:
  pull_request:
    paths:
      - .github/workflows/routing-source-snapshot.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --output=routing-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: routing-source
          path: routing-source.zip
          retention-days: 1
