name: PR11 review snapshot
on:
  push:
    branches: [codex/pr11-review-snapshot]
permissions:
  contents: read
jobs:
  apply-reviewed-fix:
    if: github.repository == 'acecore-systems/codex-task-routing' && github.ref == 'refs/heads/codex/pr11-review-snapshot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact tested patch and remove temporary review files
        shell: bash
        env:
          RELEASE_BASE: 59879ad02995c16e398de7bd7fd0e2f2d58ad9b7
        run: |
          set -euo pipefail
          git diff --exit-code 6f57344a35813698b30ae4010cf350a1901dcc0e HEAD -- . ':!.github/workflows/review-snapshot.yml' ':!.github/pr11-review.b64'
          python - <<'PY'
          import base64, hashlib, os, zlib
          from pathlib import Path
          encoded = Path('.github/pr11-review.b64').read_text().strip()
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3a91416c8cf224b31804219c685b800d7a5a4b9068875c4773e14c20bc1a050f'
          Path(os.environ['RUNNER_TEMP'], 'pr11-review.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/pr11-review.patch"
          git apply --index "$RUNNER_TEMP/pr11-review.patch"
          git rm .github/workflows/review-snapshot.yml .github/pr11-review.b64
          test "$(git write-tree)" = e98273c6ffd8de2ad6473480fe97c2cb9845ef34
          python -m unittest discover -s tests -v
          python scripts/check_package.py
          python scripts/check_release.py
          git diff --cached --check
          git diff --exit-code
          test "$(git write-tree)" = e98273c6ffd8de2ad6473480fe97c2cb9845ef34
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'PR #11: 依頼サイズと初回操作の事前確認を改善'
          git push origin HEAD:codex/pr11-review-snapshot
